```html
<section class="section">
  <div class="container">
    <h1 class="section-title">Your Cart</h1>
    
    <div id="cartContent">
      <!-- Cart content will be dynamically populated -->
    </div>
    
    <div id="emptyCart" class="cart-empty d-none">
      <i class="fas fa-shopping-cart"></i>
      <h3>Your cart is empty</h3>
      <p class="text-muted">Add some delicious items from our menu!</p>
      <a href="/menu" onclick="navigateTo('/menu'); return false;" class="btn btn-primary mt-3">View Menu</a>
    </div>
    
    <div id="cartItems" class="row d-none">
      <div class="col-lg-8">
        <div class="bg-white p-4 rounded shadow-sm">
          <h4 class="mb-3">Cart Items</h4>
          <div id="cartItemsList">
            <!-- Cart items will be dynamically populated -->
          </div>
          
          <div class="mt-4 text-end">
            <button id="clearCartBtn" class="btn btn-outline-secondary me-2">Clear Cart</button>
            <a href="/menu" onclick="navigateTo('/menu'); return false;" class="btn btn-outline-primary">Add More Items</a>
          </div>
        </div>
      </div>
      
      <div class="col-lg-4 mt-4 mt-lg-0">
        <div class="bg-white p-4 rounded shadow-sm">
          <h4 class="mb-3">Order Summary</h4>
          
          <div id="cartSummary">
            <!-- Cart summary will be dynamically populated -->
          </div>
          
          <a href="/checkout" onclick="navigateTo('/checkout'); return false;" class="btn btn-primary w-100">
            <i class="fas fa-shopping-bag me-2"></i>Proceed to Checkout
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
